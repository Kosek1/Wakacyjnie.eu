[build]
  publish = "."
  command = "npm run build"

[[headers]]
  for = "/data/articles.json"
  [headers.values]
    Cache-Control = "public, max-age=60"

# Statyczne zasoby (skompilowany CSS, ikony, obrazki, logo, favicon) —
# zawartość zmienia się tylko wtedy, gdy sami je podmienimy przy kolejnym
# wdrożeniu, więc mogą być cache'owane długo u odwiedzającego. Netlify samo
# dodaje "immutable" tylko dla plików z hashem w nazwie — te nazwy są stałe,
# więc immutable pominięte celowo (żeby zmiana pliku po nowym deployu była
# widoczna po odświeżeniu, a nie dopiero po tygodniu).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Duplikaty artykułów zostały kiedyś wgrane też do katalogu głównego
# (identyczna treść pod dwoma adresami = duplicate content dla Google).
# Docelowe pliki żyją w /artykuly/ — te trafiają tam przez stałe 301,
# żeby nie zgubić linków, które już mogły zaindeksować starą lokalizację.
[[redirects]]
  from = "/darmowy-bagaz-podreczny-nowe-prawa-pasazerow-ue.html"
  to = "/artykuly/darmowy-bagaz-podreczny-nowe-prawa-pasazerow-ue.html"
  status = 301
  force = true

[[redirects]]
  from = "/egipt-nowa-e-wiza-zasady-wjazdu-2026.html"
  to = "/artykuly/egipt-nowa-e-wiza-zasady-wjazdu-2026.html"
  status = 301
  force = true

[[redirects]]
  from = "/etias-ees-2026-kogo-naprawde-dotycza.html"
  to = "/artykuly/etias-ees-2026-kogo-naprawde-dotycza.html"
  status = 301
  force = true

[[redirects]]
  from = "/najtansze-kierunki-lotnicze-jesien-2026.html"
  to = "/artykuly/najtansze-kierunki-lotnicze-jesien-2026.html"
  status = 301
  force = true

[[redirects]]
  from = "/podatek-turystyczny-barcelona-hiszpania-2026.html"
  to = "/artykuly/podatek-turystyczny-barcelona-hiszpania-2026.html"
  status = 301
  force = true

# Stara domena Netlify — jeśli zostanie skasowana/przekierowana ręcznie
# w ustawieniach Netlify, ta reguła jest nieużywana; zostawiona jako
# siatka bezpieczeństwa, gdyby wakacyjnie.netlify.app nadal trafiał na ten sam projekt.
[[redirects]]
  from = "https://wakacyjnie.netlify.app/*"
  to = "https://ogarnijwakacje.pl/:splat"
  status = 301
  force = true

# Wymuszenie jednej kanonicznej domeny — strona ma działać wyłącznie pod
# ogarnijwakacje.pl (bez www). Netlify i tak robi to automatycznie dla
# domeny głównej, ale reguła zostaje jako jawna siatka bezpieczeństwa.
[[redirects]]
  from = "https://www.ogarnijwakacje.pl/*"
  to = "https://ogarnijwakacje.pl/:splat"
  status = 301
  force = true
